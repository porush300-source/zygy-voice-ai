services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"שָׁלוֹם, אֲנִי זוּשָא הַגָּאוֹן, הַבּוֹט הַיַּדְעָן שֶׁלְּךָ, שְׁאַל אוֹתִי כָּל דָּבָר, וּבְסִיּוּם הַקֵּשׁ סוּלָמִית\",\"x\":\"\"},{\"p\":\"2\",\"m\":\"1\",\"g\":\"שָׁלוֹם, אֲנִי זֵלִיג הַמְּשֻׁפְשָׁף , הַבּוֹט שֶׁשָּׂם אוֹתְךָ בַּכִּיס הַקָּטָן, שְׁאַל אוֹתִי כָּל דָּבָר, וּבְסִיּוּם הַקֵּשׁ סוּלָמִית\",\"x\":\"תעקוץ בצורה ישיבתית\"},{\"p\":\"3\",\"m\":\"3\",\"g\":\"שָׁלוֹם אֲנִי דּוּבְּצֶ'ה הַצַּדִּיק, הַבּוֹט שֶׁבֶּאֱמֶת מֵבִין אוֹתְךָ, שְׁאַל אוֹתִי כָּל דָּבָר, וּבְסִיּוּם הַקֵּשׁ סוּלָמִית\",\"x\":\"תחמיא ותהיה אמפתי\"}]"
      - key: MAX_WORDS
        value: "25"
      - key: EXTRA_INSTRUCTION
        value: "קוראים למשתמש יאיר"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
